<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفيق الطريق الإسلامي</title>
<style>
  /* ===== مظهر مستوحى من واجهة Android TV: خلفية متدرجة بنفسجي/أزرق، شريط جانبي بأيقونات دائرية، بطاقات كبيرة ===== */
  :root {
    --g1: #4b1d5e;
    --g2: #2a2352;
    --g3: #17294a;
    --accent: #ffffff;
    --text: #f4f1f8;
    --muted: #b9b0cc;
    --card: rgba(255,255,255,.10);
    --radius: .8em;
    --fs: 1.65;          /* حجم الخط = نسبة من عرض الشاشة (cqw) فيتناسب مع أي مقاس */
    --gap: .8em;
    /* سلّم موحّد للنصوص */
    --t-cap: .7em;  --t-sm: .85em;  --t-body: 1em;  --t-title: 1.3em;
    --c-quran: #e8365d;
    --c-lessons: #1a73e8;
    --c-youtube: #e62117;
    --c-map: #f4b400;
    --c-songs: #00a896;

  --c-prayer: #2e9e6f; --c-phone: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #05060a; color: var(--text);
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    gap: 16px; padding: 16px;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  .frame { width: min(100%, 1100px); container-type: inline-size; }
  .screen {
    width: 100%; aspect-ratio: 16/9; border-radius: 24px;
    border: 6px solid #2b2f3a; overflow: hidden; position: relative;
    background: linear-gradient(160deg, var(--g1) 0%, var(--g2) 48%, var(--g3) 100%);
    display: grid; grid-template-columns: 4.7em 1fr; font-size: calc(var(--fs) * 1cqw);
  }

  /* الشريط الجانبي (يمين الشاشة) */
  .rail { display: flex; flex-direction: column; align-items: center; gap: .7em; padding: .7em 0; }
  .rail .ico {
    width: 2.9em; height: 2.9em; border-radius: 50%; display: grid; place-items: center;
    font-size: 1.35em; transition: transform .15s, box-shadow .15s;
  }
  .rail button { display: flex; flex-direction: column; align-items: center; gap: .2em; color: var(--muted); font-size: var(--t-cap); }
  .rail button.on { color: #fff; }
  .rail button.on .ico, .rail button:hover .ico, .rail button:focus-visible .ico {
    transform: scale(1.12); box-shadow: 0 0 0 .12em #fff;
  }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* شريط البحث العلوي */
  .top { display: flex; align-items: center; gap: .65em; padding: .8em .9em .3em 1.1em; }
  .search {
    flex: 1; display: flex; align-items: center; gap: .55em; background: rgba(255,255,255,.14);
    border-radius: 999px; padding: 0 1em; height: 2.55em;
  }
  .search .dots { display: flex; gap: .17em; }
  .search .dots i { width: .4em; height: .4em; border-radius: 50%; display: block; }
  .search input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); }
  .search input::placeholder { color: var(--muted); }
  .clock { color: var(--muted); font-size: var(--t-sm); min-width: 3.4em; text-align: center; }
  .pill { background: rgba(255,255,255,.16); border-radius: 999px; padding: 0 1em; height: 2.55em; font-size: var(--t-body); }
  .pill:hover, .pill:focus-visible { background: #fff; color: #1b1030; }

  /* الخانات */
  .panels { flex: 1; display: flex; gap: var(--gap); padding: .3em .9em .55em 1.1em; min-height: 0; }
  .panel {
    flex: 1; min-width: 0; container-type: inline-size; overflow-y: auto; overflow-x: hidden; border-radius: var(--radius);
    padding: .2em .3em; scrollbar-width: none; outline: 2px solid transparent; outline-offset: 2px;
  }
  .split .panel.active { outline-color: rgba(255,255,255,.45); }
  .sec { color: var(--muted); font-size: var(--t-sm); margin: .5em .2em; }
  .rowh { display: flex; gap: .65em; overflow-x: auto; padding: .45em .2em .8em; scrollbar-width: none; }

  /* بطاقات صغيرة (القرّاء) */
  .tile {
    flex: 0 0 auto; width: clamp(3.7em, calc(100cqw / 6.3), 6em); height: clamp(1.8em, 6cqw, 2.35em); border-radius: .5em; padding: 0 .4em;
    background: var(--card); display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: var(--t-sm); transition: transform .15s, box-shadow .15s;
  }
  .tile.on { background: #fff; color: #1b1030; font-weight: 700; }
  /* بطاقات كبيرة (السور والدروس) */
  .card {
    flex: 0 0 auto; width: clamp(4.3em, calc(100cqw / 4.65), 10em); aspect-ratio: 16/10; border-radius: var(--radius); position: relative;
    overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: .55em .65em;
    text-align: center; transition: transform .15s, box-shadow .15s;
  }
  .card .no { position: absolute; top: .1em; left: .3em; font-size: 1.6em; font-weight: 800; opacity: .28; }
  .card b { font-size: clamp(.6em, 2.4cqw, .85em); line-height: 1.35; overflow-wrap: anywhere; }
  .card small { color: rgba(255,255,255,.78); font-size: var(--t-cap); }
  .card.playing::after {
    content: "🔊"; position: absolute; top: .45em; right: .55em; font-size: var(--t-body);
  }
  .card.wide { width: clamp(6em, calc(100cqw / 3.45), 13.3em); }
  .card.wide .no { display: none; }
  .tile:hover, .card:hover, .tile:focus-visible, .card:focus-visible {
    transform: scale(1.06); box-shadow: 0 0 0 .12em #fff, 0 .6em 1.3em rgba(0,0,0,.45); z-index: 2;
  }

  /* يوتيوب (محاكاة) */
  .yt { display: flex; flex-direction: column; gap: .55em; height: calc(100% - 8px); padding: 4px; }
  .yt .in { display: flex; gap: 8px; }
  .yt input { flex: 1; background: rgba(255,255,255,.14); border: 0; border-radius: 999px; padding: 0 1em; height: 2.45em; outline: 0; font-size: var(--t-body); }
  .yt .video { flex: 1; min-height: 6.7em; background: #000; border-radius: var(--radius); display: grid; place-items: center; color: var(--muted); font-size: var(--t-sm); }

  /* خريطة (محاكاة) */
  .map {
    height: calc(100% - 8px); min-height: 9em; border-radius: var(--radius); position: relative;
    background:
      linear-gradient(90deg, transparent 49%, rgba(255,255,255,.12) 49% 51%, transparent 51%) 0 0/110px 110px,
      linear-gradient(0deg, transparent 49%, rgba(255,255,255,.12) 49% 51%, transparent 51%) 0 0/110px 110px,
      linear-gradient(135deg, #1d3a37, #1b2d4a);
  }
  .pin { position: absolute; top: 45%; left: 48%; width: 1.2em; height: 1.2em; background: #ff5a4e; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
  .map small { position: absolute; bottom: .55em; right: .65em; color: var(--muted); font-size: var(--t-cap); }

  /* شريط التشغيل */
  .bar {
    display: flex; align-items: center; gap: 10px; margin: 0 .9em .65em 1.1em; padding: .35em .9em;
    background: rgba(10,8,25,.55); backdrop-filter: blur(6px); border-radius: 999px; position: relative; overflow: hidden;
  }
  .bar .title { flex: 1; font-size: var(--t-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl { width: 2.55em; height: 2.55em; border-radius: 50%; background: rgba(255,255,255,.14); font-size: var(--t-body); }
  .ctl.big { background: #fff; color: #1b1030; width: 2.9em; height: 2.9em; }
  .ctl:hover, .ctl:focus-visible { box-shadow: 0 0 0 .12em #fff; }
  .progress { position: absolute; bottom: 0; right: 0; left: 0; height: .55em; background: rgba(255,255,255,.18); cursor: pointer; touch-action: none; }
  .progress::before { content: ""; position: absolute; inset: -.8em 0 0 0; }
  .bar { padding-bottom: .85em !important; }
  .bar .time { color: var(--muted); font-size: var(--t-cap); direction: ltr; white-space: nowrap; }
  .ctl.sk { font-size: var(--t-cap); }
  .progress i { display: block; height: 100%; width: 0; background: #fff; }

  /* السور: شبكة، في كل سطر أربع سور */
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .65em; padding: .45em .2em .8em; }
  .grid4 .card { width: auto; }

  /* خانة اسم القارئ */
  .reciter {
    display: flex; align-items: center; gap: .6em; width: 100%; height: 2.4em; padding: 0 1em;
    margin: .2em 0 .4em; background: rgba(255,255,255,.14); border-radius: 999px; font-size: var(--t-sm);
    transition: box-shadow .15s;
  }
  .reciter span:first-child { color: var(--muted); }
  .reciter b { flex: 1; text-align: right; font-size: var(--t-body); }
  .reciter:hover, .reciter:focus-visible { box-shadow: 0 0 0 .12em #fff; }
  /* بلاطات اختيار القارئ */
  .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8em, 1fr)); gap: .5em; padding: .1em .2em .5em; }
  .rtile {
    display: flex; align-items: center; justify-content: center; min-height: 2.7em; padding: .4em .5em;
    background: rgba(255,255,255,.14); border-radius: var(--radius); font-size: var(--t-sm); line-height: 1.3;
    text-align: center; transition: box-shadow .15s, background .15s;
  }
  .rtile:hover, .rtile:focus-visible { box-shadow: 0 0 0 .12em #fff; }
  .rtile.on { background: #fff; color: #1b1030; font-weight: 700; }

  /* السحب والإفلات */
  .rail button, .grip { touch-action: none; user-select: none; -webkit-user-select: none; }
  .grip {
    position: sticky; top: 0; z-index: 3; display: flex; justify-content: center; align-items: center; gap: 8px;
    height: 1.6em; margin: -.2em -.3em .35em; background: rgba(0,0,0,.28); color: var(--muted);
    border-radius: var(--radius) var(--radius) 0 0; cursor: grab; font-size: var(--t-cap);
  }
  .grip:hover { background: rgba(0,0,0,.4); color: #fff; }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  .panel.drop { outline: 3px dashed #fff !important; background: rgba(255,255,255,.10); }
  .ghost {
    position: fixed; z-index: 99; pointer-events: none; transform: translate(-50%, -50%) scale(1.1);
    display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 10px; border-radius: 999px;
    background: #fff; color: #1b1030; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: 16px;
  }
  .ghost .ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
  .hint { width: min(100%, 1100px); color: var(--muted); font-size: 15px; text-align: center; }

  /* لوحة التعديل */
  .tweak {
    width: min(100%, 1100px); background: #12121c; border-radius: 16px; padding: 16px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; font-size: 15px;
  }
  .tweak h2 { grid-column: 1/-1; font-size: 16px; }
  .tweak label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
  .tweak input[type=color] { width: 100%; height: 36px; border: 0; background: none; padding: 0; }
  .tweak button { background: #232336; padding: 10px; border-radius: 10px; }

  /* ===== وضع التطبيق (APK): ملء الشاشة بدون إطار المعاينة ===== */
  html, body { height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  body { padding: 0; gap: 0; min-height: 100%; display: block; }
  .hint, .tweak { display: none !important; }
  .frame { width: 100vw; height: 100vh; }
  .screen { width: 100%; height: 100%; aspect-ratio: auto; border: 0; border-radius: 0; }

  /* يوتيوب */
  .ytbody { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .ytgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(9em, 1fr)); gap: .7em; padding: .3em .1em; }
  .ytcard { display: flex; flex-direction: column; gap: .3em; text-align: right; border-radius: var(--radius); transition: transform .15s, box-shadow .15s; }
  .ytcard img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: var(--radius); background: #000; }
  .ytcard b { font-size: var(--t-sm); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ytcard small { color: var(--muted); font-size: var(--t-cap); }
  .ytcard:hover, .ytcard:focus-visible { transform: scale(1.04); box-shadow: 0 0 0 .12em #fff; }
  .ytkey { display: flex; flex-direction: column; gap: .6em; padding: .3em; }
  .ytkey input { flex: 1; background: rgba(255,255,255,.14); border: 0; border-radius: 999px; padding: 0 1em; height: 2.45em; outline: 0; }

  /* خلفية دائمة بشفافية 40% */
  .screen::before { content: ""; position: absolute; inset: 0; background: url("bg.jpg") center/cover no-repeat; opacity: .4; z-index: 0; pointer-events: none; }
  .rail, .main { position: relative; z-index: 1; }

  /* خلفية دائمة بشفافية 40% */
  .screen::before { content: ""; position: absolute; inset: 0; z-index: 0; background: url("bg.jpg") center/cover no-repeat; opacity: .4; pointer-events: none; }
  .rail, .main { position: relative; z-index: 1; }

  .rail { overflow-y: auto; scrollbar-width: none; gap: .45em !important; }
  /* الصلاة */
  .pr-head { display: flex; justify-content: space-between; align-items: center; gap: .6em; margin: .3em .2em .6em; flex-wrap: wrap; }
  .pr-head b { font-size: var(--t-title); } .pr-head small { color: var(--muted); font-size: var(--t-sm); }
  .pr-next { background: rgba(255,255,255,.14); border-radius: var(--radius); padding: .6em .9em; margin: 0 .2em .6em; display: flex; justify-content: space-between; align-items: center; font-size: var(--t-body); }
  .pr-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .65em; padding: .2em .2em .6em; }
  .pr-card { border-radius: var(--radius); padding: .6em; text-align: center; background: var(--card); }
  .pr-card.next { background: #fff; color: #1b1030; }
  .pr-card b { display: block; font-size: var(--t-sm); } .pr-card span { font-size: var(--t-title); font-weight: 700; display: block; }
  .pr-set { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; padding: 0 .2em .6em; }
  .pr-set select, .pr-set button { height: 2.3em; border-radius: 999px; background: rgba(255,255,255,.14); padding: 0 .8em; border: 0; font-size: var(--t-sm); color: var(--text); }
  .pr-set select option { color: #111; }
  /* الهاتف */
  .ph-num { width: 100%; height: 2.6em; background: rgba(255,255,255,.14); border: 0; border-radius: 999px; text-align: center; direction: ltr; font-size: var(--t-title); outline: 0; margin: .3em 0; }
  .ph-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5em; padding: .5em .2em; }
  .ph-pad button { height: 2.4em; border-radius: var(--radius); background: rgba(255,255,255,.14); font-size: var(--t-title); }
  .ph-list { display: flex; flex-direction: column; gap: .35em; padding: .3em .2em; max-height: 60vh; overflow-y: auto; }
  .ph-row { display: flex; align-items: center; gap: .7em; text-align: start; padding: .6em .9em; border-radius: var(--radius); background: rgba(255,255,255,.12); }
  .ph-row b { flex: 1; font-weight: 600; }
  .ph-row i { font-style: normal; opacity: .75; direction: ltr; }
  .ph-act { display: flex; gap: .5em; padding: 0 .2em .5em; flex-wrap: wrap; }
  #floatBtn[hidden] { display: none; }

  /* ===== توافق مع مختلف أحجام الشاشات ===== */
  .frame { height: 100vh; height: 100dvh; }
  .screen { font-size: max(12px, calc(var(--fs) * min(1vw, 1.78vh))); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .bar .title { min-width: 0; }
  @media (max-width: 760px), (orientation: portrait) {
    .screen { font-size: clamp(13px, 3.8vw, 19px); grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .main { order: 1; }
    .rail { order: 2; flex-direction: row; justify-content: flex-start; padding: .4em .6em; overflow-x: auto; overflow-y: hidden; gap: .9em !important; }
    .rail button { flex: 0 0 auto; }
    .rail .ico { width: 2.4em; height: 2.4em; font-size: 1.15em; }
    .top { flex-wrap: wrap; padding: .6em .7em .2em; }
    .search { flex: 1 1 100%; }
    .clock { display: none; }
    .panels.split { flex-direction: column; }
    .panels.split .panel { flex: 1 1 0; min-height: 0; }
    .panels { padding: .2em .6em .4em; }
    .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bar { margin: 0 .6em .4em; padding: .3em .6em .85em; gap: 6px; }
    .ctl { width: 2.3em; height: 2.3em; } .ctl.big { width: 2.6em; height: 2.6em; }
  }
  @media (max-height: 420px) and (orientation: landscape) and (min-width: 761px) {
    .screen { font-size: clamp(11px, 3.6vh, 16px); }
    .top { padding-top: .3em; flex-wrap: nowrap; } .clock { display: none; }
    .rail { gap: .3em !important; padding: .3em 0; } .rail .ico { width: 2.3em; height: 2.3em; font-size: 1.1em; }
    .bar { margin-bottom: .3em; padding: .2em .8em .6em; }
    .grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }

  .lib-in { display: flex; gap: .5em; padding: 0 .2em .5em; }
  .lib-in input { flex: 1; min-width: 0; background: rgba(255,255,255,.14); border: 0; border-radius: 999px; padding: 0 1em; height: 2.3em; outline: 0; direction: ltr; }

  .cal-f { display: flex; flex-direction: column; gap: .2em; font-size: var(--t-sm); color: var(--muted); }
  .cal-f input { height: 2.2em; border-radius: .6em; border: 0; background: rgba(255,255,255,.14); color: var(--text); padding: 0 .5em; direction: ltr; color-scheme: dark; min-width: 0; }
  .cal-st { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,.1); border-radius: 999px; padding: .2em .4em; font-size: var(--t-sm); }
  .cal-st button { width: 2em; height: 2em; border-radius: 50%; background: rgba(255,255,255,.16); }

  /* ===== الهوية البصرية: ليل الصحراء + زخرفة الزليج (نجمة ثمانية) + نحاس ذهبي ===== */
  :root {
    --ink: #0a171b; --ink2: #0f2a2d; --teal: #17484a; --brass: #d9b25f; --brass2: #a9812f; --ivory: #f4ecd8;
    --g1: #123a3c; --g2: #0c2326; --g3: #070f13;
    --text: var(--ivory); --muted: #9fb7b1; --card: rgba(244,236,216,.09);
    --glass: rgba(9,24,28,.58); --hair: rgba(217,178,95,.28);
    --c-quran: #1f9d74; --c-lessons: #4a78d6; --c-youtube: #d9372b; --c-songs: #c8517a;
    --c-prayer: #c9a24a; --c-phone: #2fb1c9; --c-map: #e07b39;
    --radius: 1em;
    --star: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' viewBox='0 0 56 56'><g fill='none' stroke='%23f4ecd8' stroke-width='1' stroke-opacity='.9'><rect x='14' y='14' width='28' height='28'/><rect x='14' y='14' width='28' height='28' transform='rotate(45 28 28)'/></g></svg>");
  }
  body { font-family: "Noto Naskh Arabic", "Noto Sans Arabic", "Droid Arabic Naskh", "Segoe UI", Tahoma, sans-serif; line-height: 1.55; }
  .screen {
    background:
      radial-gradient(120% 80% at 85% 0%, rgba(217,178,95,.16), transparent 55%),
      linear-gradient(165deg, var(--g1) 0%, var(--g2) 52%, var(--g3) 100%);
  }
  .screen::before { opacity: .34 !important; mix-blend-mode: luminosity; }
  .screen::after {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: var(--star) 0 0/56px 56px; opacity: .045;
    -webkit-mask-image: linear-gradient(200deg, #000 0%, transparent 70%); mask-image: linear-gradient(200deg, #000 0%, transparent 70%);
  }
  .rail { background: linear-gradient(270deg, rgba(5,14,17,.55), rgba(5,14,17,.18)); border-inline-start: 1px solid var(--hair); }
  .rail .ico { box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -.25em .5em rgba(0,0,0,.25), 0 .3em .7em rgba(0,0,0,.35); }
  .rail button { font-weight: 600; }
  .rail button.on { color: var(--brass); }
  .rail button.on .ico, .rail button:hover .ico, .rail button:focus-visible .ico { box-shadow: 0 0 0 .14em var(--ink), 0 0 0 .26em var(--brass), 0 .4em 1em rgba(0,0,0,.45); transform: scale(1.08); }
  .search .dots { display: none; }
  .search, .reciter, .yt input, .ytkey input, .ph-num, .lib-in input { background: var(--glass); border: 1px solid var(--hair); backdrop-filter: blur(8px); }
  .search:focus-within, .reciter:hover, .reciter:focus-visible { border-color: var(--brass); box-shadow: 0 0 0 .1em rgba(217,178,95,.25); }

function parseRemoteText(t) {

  if (QB.gps != null) return { deg: QB.gps, msg: "🛰 آخر اتجاه GPS معروف — تحرّك لتحديثه" };

document.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.on && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) { drag.on = true; makeGhost(drag); }
  if (!drag.on) return;
  ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px";
  document.querySelectorAll(".panel.drop").forEach(p => p.classList.remove("drop"));
  panelAt(e.clientX, e.clientY)?.classList.add("drop");
});
document.addEventListener("pointerup", e => {
  if (!drag) return;
  if (drag.on) {
    justDragged = true; setTimeout(() => justDragged = false, 0);
    const p = panelAt(e.clientX, e.clientY);
    if (p) {
      const to = +p.dataset.panel;
      if (drag.kind === "type") { state.panels[to] = drag.val; state.active = to; }
      else {
        const from = +drag.val;
        if (from !== to) { [state.panels[from], state.panels[to]] = [state.panels[to], state.panels[from]]; state.active = to; }
      }
    }
    endDrag(); render();
  }
  drag = null;
});
document.addEventListener("pointercancel", () => { endDrag(); drag = null; });

// ---- لوحة التعديل ----
const root = document.documentElement.style;
document.querySelectorAll("input[type=color]").forEach(i => i.oninput = () => root.setProperty(i.dataset.var, i.value));
$("fs").oninput = e => root.setProperty("--fs", e.target.value);
$("rad").oninput = e => root.setProperty("--radius", e.target.value + "em");
$("reset").onclick = () => location.reload();
$("copy").onclick = () => {
  const cs = getComputedStyle(document.documentElement);
  const t = ["--g1","--g2","--g3","--c-quran","--c-lessons","--c-youtube","--c-map","--c-songs","--fs","--radius"]
    .map(v => `${v}: ${cs.getPropertyValue(v).trim()}`).join("\n");
  navigator.clipboard?.writeText(t); alert(t);
};
render();
refreshLibrary(true);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshLibrary(true); });
try { if (window.AndroidLib && !AndroidLib.hasPermission() && !localStorage.getItem("askedMedia")) { localStorage.setItem("askedMedia", "1"); AndroidLib.requestPermission(); } } catch (e) {}
if (window.AndroidFloat) {
  $("floatBtn").hidden = false;
  $("floatBtn").onclick = () => {
    if (!AndroidFloat.canDraw()) { AndroidFloat.requestPermission(); return; }
    floatOn = !floatOn; floatOn ? AndroidFloat.show() : AndroidFloat.hide();
    $("floatBtn").textContent = floatOn ? "🪟 إخفاء العائم" : "🪟 شريط عائم";
    setTimeout(pushFloat, 600);
  };
}
try { if (window.AndroidPrayer && PS().adhan && !localStorage.getItem("askedNotif")) { localStorage.setItem("askedNotif", "1"); AndroidPrayer.requestPermissions(); } } catch (e) {}
schedulePrayers();
</script>
</body>
